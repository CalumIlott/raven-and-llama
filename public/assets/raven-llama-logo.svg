<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>

    <linearGradient id="sunGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>

    <!-- Deep Jet Black Raven Feathers -->
    <linearGradient id="ravenFeathers" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#465b70" />
      <stop offset="45%" stop-color="#293c50" />
      <stop offset="100%" stop-color="#152433" />
    </linearGradient>

    <linearGradient id="ravenBeak" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="llamaWool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f5f5f4" />
      <stop offset="100%" stop-color="#e7e5e4" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Emblem Border -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGrad)" stroke="#3f3f46" stroke-width="4" filter="url(#softShadow)" />
  <circle cx="250" cy="250" r="232" fill="none" stroke="#71717a" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Background Warm Glow -->
  <circle cx="250" cy="270" r="160" fill="url(#sunGlow)" />

  <!-- Subtle Constellation Stars -->
  <circle cx="120" cy="110" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="390" cy="130" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="250" cy="70" r="3.5" fill="#e4e4e7" opacity="0.9"/>
  <circle cx="170" cy="70" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="340" cy="80" r="2" fill="#ffffff" opacity="0.6"/>

  <!-- ==================== LLAMA (RIGHT SIDE) ==================== -->
  <g id="llama-group">
    <!-- Llama Neck & Body -->
    <path d="M 280 410 C 280 340 275 260 285 220 C 290 195 305 185 330 185 C 365 185 385 210 380 260 C 375 300 380 350 420 410 Z" fill="url(#llamaWool)" stroke="#d6d3d1" stroke-width="1.5" />

    <!-- Llama Ears -->
    <path d="M 315 190 C 305 145 310 105 325 100 C 335 96 340 120 332 185 Z" fill="#f5f5f4" stroke="#d6d3d1" stroke-width="1.5"/>
    <path d="M 320 170 C 315 140 318 115 325 112 C 330 110 332 125 328 165 Z" fill="#fb7185" opacity="0.4"/>

    <path d="M 360 190 C 370 145 365 105 350 100 C 340 96 335 120 345 185 Z" fill="#f5f5f4" stroke="#d6d3d1" stroke-width="1.5"/>
    <path d="M 355 170 C 360 140 357 115 350 112 C 345 110 343 125 348 165 Z" fill="#fb7185" opacity="0.4"/>

    <!-- Llama Head Fluff -->
    <circle cx="338" cy="180" r="35" fill="url(#llamaWool)" />
    <circle cx="315" cy="195" r="22" fill="url(#llamaWool)" />
    <circle cx="360" cy="195" r="22" fill="url(#llamaWool)" />

    <!-- Llama Snout -->
    <ellipse cx="340" cy="225" rx="26" ry="22" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1.5"/>
    <ellipse cx="340" cy="216" rx="8" ry="5" fill="#f43f5e" opacity="0.7"/>
    <path d="M 340 221 L 340 230 M 333 229 Q 340 235 347 229" stroke="#44403c" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Cheeks -->
    <circle cx="312" cy="225" r="6" fill="#fb7185" opacity="0.4" />
    <circle cx="368" cy="225" r="6" fill="#fb7185" opacity="0.4" />

    <!-- Llama Eyes -->
    <circle cx="318" cy="192" r="5.5" fill="#18181b" />
    <circle cx="316" cy="190" r="1.8" fill="#ffffff" />
    <circle cx="362" cy="192" r="5.5" fill="#18181b" />
    <circle cx="360" cy="190" r="1.8" fill="#ffffff" />

    <!-- Modern Glasses for Llama -->
    <circle cx="318" cy="193" r="14" fill="none" stroke="#38bdf8" stroke-width="3" />
    <circle cx="362" cy="193" r="14" fill="none" stroke="#38bdf8" stroke-width="3" />
    <path d="M 332 193 Q 340 189 348 193" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <path d="M 304 193 L 295 190 M 376 193 L 385 190" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Modern Woven Collar -->
    <path d="M 288 285 Q 340 310 380 280 L 388 315 Q 340 345 282 320 Z" fill="#0284c7" />
    <path d="M 285 300 Q 340 325 384 295" stroke="#facc15" stroke-width="3.5" fill="none" stroke-dasharray="8 4"/>
  </g>

  <!-- ==================== RAVEN (LEFT SIDE - JET BLACK FEATHERS) ==================== -->
  <g id="raven-group">
    <!-- Raven Body & Wing -->
    <path d="M 195 400 C 185 320 180 250 160 215 C 145 190 125 185 105 210 C 85 240 95 320 100 400 Z" fill="url(#ravenFeathers)" stroke="#60778b" stroke-width="1.5" />

    <!-- Layered slate-blue wing feathers -->
    <path d="M 175 250 C 195 285 205 340 170 395 C 150 365 145 310 155 260 Z" fill="#263a4d" stroke="#60788d" stroke-width="1.5" />
    <path d="M 155 275 C 175 310 180 355 150 405 C 135 375 130 330 140 285 Z" fill="#1c2f40" stroke="#4c6479" stroke-width="1.2"/>

    <!-- Distinct feather shafts -->
    <path d="M 145 320 Q 170 345 155 385" stroke="#8097aa" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 135 335 Q 155 360 142 395" stroke="#5d768b" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Feather crest -->
    <path d="M 148 165 C 135 150 137 134 147 123 C 153 140 159 147 166 154 Z" fill="#30485d" stroke="#70889c" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 163 158 C 157 139 166 124 178 117 C 177 136 183 146 184 160 Z" fill="#3b566c" stroke="#8097aa" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 179 160 C 180 145 190 135 202 132 C 196 147 197 155 197 166 Z" fill="#293f53" stroke="#647d92" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Raven Head -->
    <circle cx="170" cy="185" r="32" fill="url(#ravenFeathers)" stroke="#60778b" stroke-width="1.5" />
    <path d="M 148 165 C 140 175 142 195 150 205 Z" fill="#26394c"/>
    <path d="M 151 168 Q 163 160 176 167" stroke="#7891a4" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85"/>

    <!-- Sleek Golden Beak -->
    <path d="M 142 185 Q 85 196 98 206 Q 140 208 152 201 Z" fill="url(#ravenBeak)" stroke="#92400e" stroke-width="1.5" />
    <path d="M 142 196 L 105 199" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Keen Raven Eye -->
    <circle cx="162" cy="180" r="7.5" fill="#facc15" />
    <circle cx="161" cy="180" r="4.5" fill="#000000" />
    <circle cx="159" cy="178" r="1.8" fill="#ffffff" />

    <!-- Floating feather detail in the wing -->
    <path d="M 115 280 C 105 250 115 230 135 220 C 130 240 128 260 130 285 Z" fill="#1c3042" stroke="#7a94a8" stroke-width="1.5"/>
    <path d="M 125 240 L 122 285" stroke="#a0b4c3" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- ==================== CENTER GLOWING OPEN BOOK ==================== -->
  <g id="book-group" transform="translate(0, 15)">
    <!-- Book Cover -->
    <path d="M 170 380 Q 250 365 250 395 Q 250 365 330 380 L 335 425 Q 250 405 250 435 Q 250 405 165 425 Z" fill="#18181b" stroke="#3f3f46" stroke-width="2.5" filter="url(#softShadow)"/>

    <!-- Open Clean Pages -->
    <path d="M 175 375 Q 248 360 248 390 L 248 426 Q 175 400 170 418 Z" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>
    <path d="M 325 375 Q 252 360 252 390 L 252 426 Q 325 400 330 418 Z" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>

    <!-- Subtle Lines -->
    <line x1="188" y1="385" x2="235" y2="380" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round"/>
    <line x1="188" y1="395" x2="232" y2="390" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round"/>
    <line x1="265" y1="380" x2="312" y2="385" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round"/>
    <line x1="268" y1="390" x2="312" y2="395" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round"/>

    <!-- Center Rising Sparkle -->
    <path d="M 250 335 Q 250 350 238 350 Q 250 350 250 365 Q 250 350 262 350 Q 250 350 250 335 Z" fill="#facc15" filter="url(#glow)"/>
  </g>

  <!-- ==================== BANNER & BRAND TEXT ==================== -->
  <g id="brand-banner">
    <!-- Refined Bottom Brand Ribbon -->
    <path d="M 70 445 Q 250 425 430 445 L 420 485 Q 250 465 80 485 Z" fill="#09090b" stroke="#3f3f46" stroke-width="2" filter="url(#softShadow)"/>
    <text x="250" y="472" text-anchor="middle" font-family="'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="23" fill="#ffffff" letter-spacing="3">
      RAVEN &amp; LLAMA
    </text>
  </g>
</svg>
